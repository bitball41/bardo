<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bardo Launcher</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#08080a;color:#f5f5f7;font:15px system-ui,sans-serif}.card{width:min(360px,calc(100% - 32px));padding:28px;text-align:center;background:#111114;border:1px solid #29292f;border-radius:18px}h1{margin:0 0 8px;font-size:28px}p{min-height:21px;margin:0 0 20px;color:#a5a5ae}button,a{display:block;width:100%;padding:12px 16px;border:0;border-radius:10px;background:#fff;color:#08080a;font:600 15px system-ui,sans-serif;text-decoration:none;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:#ff8585}.fallback{display:none;margin-top:10px;background:#24242a;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <h1>Bardo</h1>
    <p id="status">Ready to launch.</p>
    <button id="launch" type="button">Launch Bardo</button>
    <a id="fallback" class="fallback" href="https://bardo-live.cj-nissim.workers.dev/bardo.html" target="_blank" rel="noopener">Open Bardo directly</a>
  </main>
  <script>
    (()=>{
      const REMOTE="https://bardo-live.cj-nissim.workers.dev/bardo.html",ORIGIN=new URL(REMOTE).origin;
      const button=document.getElementById("launch"),status=document.getElementById("status"),fallback=document.getElementById("fallback");
      const setStatus=(text,error=false)=>{status.textContent=text;status.className=error?"error":""};

      button.addEventListener("click",()=>{
        // This must remain the first launch action: Chrome only permits the
        // about:blank popup while this user-activation event is still active.
        const popup=window.open("about:blank","_blank");
        if(!popup){setStatus("Popup blocked. Allow popups, then try again.",true);fallback.style.display="block";return}

        button.disabled=true;setStatus("Opening Bardo…");
        const doc=popup.document;
        doc.title="Bardo";
        doc.documentElement.style.cssText="width:100%;height:100%;margin:0;background:#000;overflow:hidden";
        doc.body.style.cssText="width:100%;height:100%;margin:0;background:#000;overflow:hidden";

        const note=doc.createElement("div");
        note.textContent="Loading Bardo…";
        note.style.cssText="position:fixed;inset:0;display:grid;place-items:center;z-index:2;background:#08080a;color:#aaa;font:15px system-ui,sans-serif";

        const frame=doc.createElement("iframe");
        frame.src=REMOTE;
        frame.title="Bardo";
        frame.referrerPolicy="no-referrer";
        frame.allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad; picture-in-picture";
        frame.allowFullscreen=true;
        frame.style.cssText="display:block;width:100%;height:100%;margin:0;border:0;overflow:hidden";
        doc.body.replaceChildren(frame,note);

        let finished=false,timeout=0;
        const fail=(message)=>{if(finished)return;clearTimeout(timeout);note.textContent=message;note.style.color="#ff8585";button.disabled=false;setStatus(message,true);fallback.style.display="block"};
        frame.addEventListener("error",()=>fail("Bardo could not be loaded. Check your connection and try again."));
        frame.addEventListener("load",()=>{if(!finished)note.textContent="Starting Bardo…"});
        popup.addEventListener("message",event=>{
          if(finished||event.source!==frame.contentWindow||event.origin!==ORIGIN||event.data?.type!=="bardo:ready")return;
          finished=true;clearTimeout(timeout);note.remove();setStatus("Bardo launched.");
          setTimeout(()=>{
            try{window.close()}catch{}
            setTimeout(()=>{if(!window.closed)location.replace("about:blank")},250);
          },3000);
        });
        timeout=setTimeout(()=>fail("Bardo took too long to start. You can retry or open it directly."),20000);
      });
    })();
  </script>
</body>
</html>
